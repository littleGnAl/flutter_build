name: Set up Flutter SDK and Engine tests
description: Check out an immutable Flutter revision and prepare its public bootstrap dependencies.
inputs:
  flutter_repo:
    description: GitHub owner/repository
    required: true
  flutter_sha:
    description: Resolved Flutter commit SHA
    required: true
  engine:
    description: Sync the Engine dependencies for source builds
    default: 'false'
outputs:
  baseline_sha:
    description: Official upstream merge base used for regression baselines
    value: ${{ steps.baseline.outputs.baseline_sha }}
  engine_hash:
    description: Published bootstrap Engine from the release pin or upstream version policy
    value: ${{ steps.baseline.outputs.engine_hash }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-ci-python
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.flutter_repo }}
        ref: ${{ inputs.flutter_sha }}
        path: flutter
        fetch-depth: 0
        persist-credentials: false
    - name: Select a public bootstrap Engine
      id: baseline
      shell: bash
      run: python3 scripts/ci/prepare_checkout.py --root flutter --results test-results
    - name: Install Linux test libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config curl unzip zip xvfb openbox \
          libgtk-3-dev libglu1-mesa libx11-dev libxi-dev libxrandr-dev libxrender-dev \
          libxcursor-dev libxinerama-dev libasound2-dev libgl1-mesa-dev libgles2-mesa-dev libvulkan-dev
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - name: Prepare SDK tools
      shell: bash
      run: |
        echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
        "$FLUTTER_ROOT/bin/flutter" --version
        "$FLUTTER_ROOT/bin/flutter" config --no-analytics
        "$FLUTTER_ROOT/bin/dart" --disable-analytics
        cd "$FLUTTER_ROOT"
        ./bin/flutter pub get
    - name: Install CocoaPods when required
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if ! command -v pod >/dev/null; then
          brew install cocoapods
        fi
    - name: Install public Depot Tools
      if: inputs.engine == 'true'
      shell: bash
      run: |
        git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/flutter-depot-tools"
        echo "$RUNNER_TEMP/flutter-depot-tools" >> "$GITHUB_PATH"
    - name: Ensure macOS Ninja is available
      if: inputs.engine == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        if ! command -v ninja >/dev/null; then
          brew install ninja
        fi
    - name: Prepare the public Metal compiler component
      if: inputs.engine == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        if ! xcrun --sdk macosx metal --version > "$FLUTTER_TEST_OUTPUTS_DIR/metal-version.log" 2>&1; then
          xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$FLUTTER_TEST_OUTPUTS_DIR/metal-toolchain-download.log"
        fi
    - name: Sync source Engine dependencies
      if: inputs.engine == 'true'
      shell: bash
      env:
        EXPECTED_SHA: ${{ inputs.flutter_sha }}
      run: |
        cd "$FLUTTER_ROOT"
        test -f engine/scripts/standard.gclient
        cp engine/scripts/standard.gclient .gclient
        gclient sync -D --no-history -j2
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        echo "$FLUTTER_ROOT/engine/src/flutter/third_party/gn" >> "$GITHUB_PATH"
        df -h .

name: Test Flutter Android tools

on:
  workflow_dispatch:
    inputs:
      flutter_repo:
        description: Flutter repository
        type: string
        default: littleGnAl/flutter
        required: true
      flutter_ref:
        description: Flutter branch, tag, or commit
        type: string
        default: master
        required: true
  workflow_call:
    inputs:
      ci_policy_artifact:
        description: Pinned official CI policy from the calling workflow
        type: string
        default: ''
      flutter_repo:
        type: string
        default: littleGnAl/flutter
      flutter_ref:
        type: string
        default: master
      resolved_sha:
        description: Optional SHA resolved by the all-platform workflow
        type: string
        default: ''

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve requested Flutter revision
        id: resolve
        env:
          FLUTTER_REPO: ${{ inputs.flutter_repo }}
          FLUTTER_REF: ${{ inputs.resolved_sha || inputs.flutter_ref }}
        run: python3 scripts/ci/resolve_ref.py --repo "$FLUTTER_REPO" --ref "$FLUTTER_REF"

  plan:
    needs: resolve
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-tests: ${{ steps.plan.outputs.has-tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.flutter_repo }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: flutter
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
      - uses: ./.github/actions/setup-official-ci
        with:
          policy-artifact: ${{ inputs.ci_policy_artifact }}
          artifact-name: official-ci-policy-android-tools-${{ needs.resolve.outputs.sha }}
      - name: Read Android tool partitions from the requested Flutter CI
        id: plan
        run: python3 scripts/ci/sdk.py plan >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-tools-plan-${{ needs.resolve.outputs.sha }}
          path: test-results/android-tools-plan.json
          if-no-files-found: error
          retention-days: 14

  android-tools:
    name: ${{ matrix.name }}
    needs: [resolve, plan]
    if: needs.plan.outputs.has-tests == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free Android runner disk space
        uses: ./.github/actions/free-linux-disk-space
      - uses: actions/download-artifact@v4
        with:
          name: official-ci-policy-android-tools-${{ needs.resolve.outputs.sha }}
          path: test-results/
      - uses: ./.github/actions/setup-flutter-tests
        with:
          flutter_repo: ${{ inputs.flutter_repo }}
          flutter_sha: ${{ needs.resolve.outputs.sha }}
      - name: Use the JDK declared by this Flutter CI target
        if: matrix.jdk != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: Install the public CIPD client for the archived Android preview SDK
        if: matrix.shard == 'android_preview_tool_integration_tests'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/sdk-preview-depot-tools"
          echo "$RUNNER_TEMP/sdk-preview-depot-tools" >> "$GITHUB_PATH"
      - name: Run all cases in the official Android tool partition
        env:
          SDK_SHARD: ${{ matrix.shard }}
          SDK_SUBSHARD: ${{ matrix.subshard }}
          ANDROID_SDK_VERSION: ${{ matrix.android_sdk }}
        shell: bash
        run: xvfb-run -a python3 scripts/ci/sdk.py sdk --shard "$SDK_SHARD" --subshard "$SDK_SUBSHARD" --android-sdk "$ANDROID_SDK_VERSION"
      - name: Upload Android tool test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tools-${{ matrix.name }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

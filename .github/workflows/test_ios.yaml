name: Test Flutter iOS

on:
  workflow_dispatch:
    inputs:
      flutter_repo:
        description: Flutter repository (owner/name)
        type: string
        required: true
        default: littleGnAl/flutter
      flutter_ref:
        description: Flutter branch, tag, or commit to test
        type: string
        required: true
        default: master
      xcode_version:
        description: Installed Xcode version; empty selects newest stable image installation
        type: string
        default: ''
  workflow_call:
    inputs:
      ci_policy_artifact:
        description: Pinned official CI policy from the calling workflow
        type: string
        default: ''
      flutter_repo:
        type: string
        default: littleGnAl/flutter
      flutter_ref:
        type: string
        default: master
      resolved_sha:
        description: Commit resolved once by the calling workflow
        type: string
        default: ''
      xcode_version:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      baseline: ${{ steps.plan.outputs.baseline }}
      simulator: ${{ steps.plan.outputs.simulator }}
      native: ${{ steps.plan.outputs.native }}
      has-baseline: ${{ steps.plan.outputs.has-baseline }}
      has-simulator: ${{ steps.plan.outputs.has-simulator }}
      has-native: ${{ steps.plan.outputs.has-native }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          FLUTTER_REPO: ${{ inputs.flutter_repo }}
          FLUTTER_REF: ${{ inputs.flutter_ref }}
          RESOLVED_SHA: ${{ inputs.resolved_sha }}
        run: |
          if [[ -n "$RESOLVED_SHA" ]]; then
            [[ "$RESOLVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
            echo "sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/resolve_ref.py --repo "$FLUTTER_REPO" --ref "$FLUTTER_REF"
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.flutter_repo }}
          ref: ${{ steps.resolve.outputs.sha }}
          path: flutter
          persist-credentials: false
      - uses: ./.github/actions/setup-official-ci
        with:
          policy-artifact: ${{ inputs.ci_policy_artifact }}
          artifact-name: official-ci-policy-ios-${{ steps.resolve.outputs.sha }}
      - name: Plan tasks available in the selected Flutter revision
        id: plan
        run: python3 scripts/ci/ios.py plan --flutter-root flutter --results test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-task-plan-${{ steps.resolve.outputs.sha }}
          path: test-results/
          retention-days: 14

  native:
    name: Native embedding and scenario (${{ matrix.variant }})
    needs: resolve
    if: needs.resolve.outputs.has-native == 'true'
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.native) }}
    env:
      FLUTTER_ROOT: ${{ github.workspace }}/flutter
      FLUTTER_TEST_OUTPUTS_DIR: ${{ github.workspace }}/test-results
      COCOAPODS_DISABLE_STATS: 'true'
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-python
      - name: Select installed Xcode before gclient SDK hooks
        env:
          XCODE_VERSION: ${{ inputs.xcode_version }}
        run: python3 scripts/ci/ios.py select-xcode --xcode-version "$XCODE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: official-ci-policy-ios-${{ needs.resolve.outputs.sha }}
          path: test-results/
      - uses: ./.github/actions/setup-flutter-tests
        with:
          flutter_repo: ${{ inputs.flutter_repo }}
          flutter_sha: ${{ needs.resolve.outputs.sha }}
          engine: 'true'
      - name: Build and run the selected ref's native test suites
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          args=()
          if [[ "$VARIANT" == extension-safe ]]; then args+=(--extension-safe); fi
          python3 scripts/ci/ios.py native --jobs 2 "${args[@]}"
      - name: Collect simulator diagnostics
        if: always()
        run: python3 scripts/ci/ios.py diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-${{ matrix.variant }}-${{ needs.resolve.outputs.sha }}
          path: test-results/
          retention-days: 14

  simulator:
    name: Simulator (${{ matrix.source_target }}, baseline Engine)
    needs: resolve
    if: needs.resolve.outputs.has-simulator == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.resolve.outputs.simulator) }}
    env:
      FLUTTER_ROOT: ${{ github.workspace }}/flutter
      FLUTTER_TEST_OUTPUTS_DIR: ${{ github.workspace }}/test-results
      COCOAPODS_DISABLE_STATS: 'true'
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-python
      - name: Select installed Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode_version }}
        run: python3 scripts/ci/ios.py select-xcode --xcode-version "$XCODE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: official-ci-policy-ios-${{ needs.resolve.outputs.sha }}
          path: test-results/
      - uses: ./.github/actions/setup-flutter-tests
        with:
          flutter_repo: ${{ inputs.flutter_repo }}
          flutter_sha: ${{ needs.resolve.outputs.sha }}
          engine: 'false'
      - name: Run the official simulator task on its declared CPU
        env:
          TASK: ${{ matrix.task }}
          SOURCE_TARGET: ${{ matrix.source_target }}
        run: python3 scripts/ci/ios.py simulator --task "$TASK" --source-target "$SOURCE_TARGET"
      - name: Collect simulator diagnostics
        if: always()
        run: python3 scripts/ci/ios.py diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-${{ matrix.id }}-${{ needs.resolve.outputs.sha }}
          path: test-results/
          retention-days: 14

  build-compatibility:
    name: SDK compatibility (${{ matrix.source_target }}, baseline Engine)
    needs: resolve
    if: needs.resolve.outputs.has-baseline == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.resolve.outputs.baseline) }}
    env:
      FLUTTER_ROOT: ${{ github.workspace }}/flutter
      FLUTTER_TEST_OUTPUTS_DIR: ${{ github.workspace }}/test-results
      COCOAPODS_DISABLE_STATS: 'true'
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-python
      - name: Select installed Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode_version }}
        run: python3 scripts/ci/ios.py select-xcode --xcode-version "$XCODE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: official-ci-policy-ios-${{ needs.resolve.outputs.sha }}
          path: test-results/
      - uses: ./.github/actions/setup-flutter-tests
        with:
          flutter_repo: ${{ inputs.flutter_repo }}
          flutter_sha: ${{ needs.resolve.outputs.sha }}
          engine: 'false'
      - name: Run complete upstream task across its original build modes
        env:
          TASK: ${{ matrix.task }}
          SOURCE_TARGET: ${{ matrix.source_target }}
        run: python3 scripts/ci/ios.py baseline --task "$TASK" --source-target "$SOURCE_TARGET"
      - name: Collect simulator diagnostics
        if: always()
        run: python3 scripts/ci/ios.py diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-baseline-${{ matrix.id }}-${{ needs.resolve.outputs.sha }}
          path: test-results/
          retention-days: 14

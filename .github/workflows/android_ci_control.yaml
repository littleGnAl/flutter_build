name: Request Android verification
run-name: Android texture GPU comparison
on:
  push:
    branches: [littlegnal/fix-flutter-ci-bootstrap]
    paths: [.github/workflows/android_ci_control.yaml]
permissions:
  actions: write
  contents: read
jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPERATION: probe
      TARGET_RUN_ID: '0'
    outputs:
      operation: ${{ steps.control.outputs.operation }}
    steps:
      - id: control
        uses: actions/github-script@v8
        with:
          script: |
            const branch = 'littlegnal/fix-flutter-ci-bootstrap';
            if (context.ref !== `refs/heads/${branch}`) {
              throw new Error('Android verification control is restricted to the repair branch');
            }
            core.setOutput('operation', process.env.OPERATION);
            if (process.env.OPERATION === 'cancel') {
              const run_id = Number(process.env.TARGET_RUN_ID);
              if (!Number.isSafeInteger(run_id) || run_id <= 0) {
                throw new Error('A specific Android run ID is required');
              }
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
              if (run.head_branch !== branch || run.path !== '.github/workflows/test_all.yaml' ||
                  !run.display_title.startsWith('Flutter android tests')) {
                throw new Error('Refusing to cancel an unrelated workflow run');
              }
              if (run.status !== 'completed') {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id});
              }
              core.info(`Requested cancellation of Android run ${run_id}`);
            } else if (process.env.OPERATION === 'dispatch') {
              const requestedAt = Date.now();
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'test_all.yaml',
                ref: branch,
                inputs: {test_suite: 'android', flutter_repo: 'littleGnAl/flutter', flutter_ref: 'master'}
              });
              core.info('Dispatched Android full verification against master');
              const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
              let run;
              for (let attempt = 0; attempt < 30; attempt++) {
                try {
                  const {data} = await github.rest.actions.listWorkflowRuns({
                    ...context.repo, workflow_id: 'test_all.yaml', branch,
                    event: 'workflow_dispatch', per_page: 10
                  });
                  run = data.workflow_runs.find(candidate =>
                    candidate.head_sha === context.sha && candidate.head_branch === branch &&
                    candidate.display_title.startsWith('Flutter android tests') &&
                    Date.parse(candidate.created_at) >= requestedAt - 10000);
                } catch (error) {
                  core.warning(`Could not query the dispatched run: ${error.message}`);
                }
                if (run) break;
                await sleep(2000);
              }
              if (!run) throw new Error('Could not identify the dispatched Android run');
              core.info(`Monitoring ${run.html_url}`);
              core.setOutput('run_id', run.id);
              const testSteps = new Set([
                'Java embedding tests', 'Build native tests',
                'Run native tests on the upstream AVD configuration',
                'Build matching Android and host engines',
                'Run functional task with matching source engines',
                'AAR / Gradle / add-to-app compatibility against baseline artifacts',
                'Generate baseline and compare the target revision',
                'Run all cases in the official Android tool partition',
                'Run ./.github/actions/setup-official-avd'
              ]);
              let previousCounts;
              while (true) {
                try {
                const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
                  ...context.repo, run_id: run.id, per_page: 100
                });
                const counts = {};
                for (const job of jobs.jobs) {
                  const key = job.conclusion || job.status;
                  counts[key] = (counts[key] || 0) + 1;
                }
                const summary = JSON.stringify(counts);
                if (summary !== previousCounts) {
                  core.info(`Android ${run.id}: ${summary}`);
                  previousCounts = summary;
                }
                const failedTest = jobs.jobs.find(job => job.runner_id &&
                  job.steps?.some(step => testSteps.has(step.name) && step.conclusion === 'failure'));
                const {data: state} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: run.id});
                if (failedTest) {
                  if (state.status !== 'completed') {
                    await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                  }
                  core.setFailed(`Android test failed: ${failedTest.name}; ${failedTest.html_url}`);
                  return;
                }
                if (state.status === 'completed') {
                  core.info(`Android run finished: ${state.conclusion}`);
                  return;
                }
                } catch (error) {
                  core.warning(`Android status query failed; retrying: ${error.message}`);
                }
                await sleep(30000);
              }
            } else if (process.env.OPERATION === 'probe') {
              core.info('Running the failed texture case with identical source artifacts and two software GPU backends');
            } else {
              throw new Error('Unsupported Android verification operation');
            }
  texture-probe:
    needs: request
    if: needs.request.outputs.operation == 'probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gpu: [official, swiftshader_indirect]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-linux-disk-space
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43909132737
          name: official-ci-policy-android-bc9b0371d817ece42e733e0d8bd6004337f8247e
          path: test-results
      - uses: ./.github/actions/setup-flutter-tests
        with:
          flutter_repo: littleGnAl/flutter
          flutter_sha: bc9b0371d817ece42e733e0d8bd6004337f8247e
          engine: 'false'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter config --jdk-dir "$JAVA_HOME"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43909132737
          name: android-app-engine-debug
          path: engine-artifacts
      - name: Restore the exact source-built Engine from the failed run
        run: |
          tar -C flutter/engine/src -xzf engine-artifacts/engine-app-debug.tar.gz
          python3 scripts/ci/android.py validate-app --modes debug
      - name: Enable KVM and install the same NDK
        run: |
          set -euxo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
      - uses: ./.github/actions/setup-official-avd
        with:
          config: android_36_google_apis_x64.textpb
          version: build_id:8719362231152674241
      - name: Run the unchanged official texture frame rate task
        env:
          GPU_MODE: ${{ matrix.gpu }}
        run: |
          gpu_arguments=()
          if [ "$GPU_MODE" != official ]; then
            gpu_arguments=(--gpu-mode "$GPU_MODE")
          fi
          python3 scripts/ci/official_avd.py run "${gpu_arguments[@]}" -- python3 scripts/ci/android.py task --name external_textures_integration_test --modes debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-texture-probe-${{ matrix.gpu }}
          path: test-results
          retention-days: 14

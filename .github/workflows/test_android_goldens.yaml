name: Test Flutter Android goldens
run-name: Android goldens · ${{ inputs.flutter_repo }}@${{ inputs.flutter_ref }}
on:
  workflow_dispatch:
    inputs:
      flutter_repo:
        description: Flutter repository
        default: littleGnAl/flutter
        required: true
        type: string
      flutter_ref:
        description: Flutter branch, tag or commit
        default: master
        required: true
        type: string
  workflow_call:
    inputs:
      flutter_repo:
        default: littleGnAl/flutter
        type: string
      flutter_ref:
        default: master
        type: string
      resolved_sha:
        default: ''
        type: string
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: ref
        env:
          FLUTTER_REPO_INPUT: ${{ inputs.flutter_repo }}
          FLUTTER_REF_INPUT: ${{ inputs.resolved_sha || inputs.flutter_ref }}
        run: python3 scripts/ci/resolve_ref.py --repo "$FLUTTER_REPO_INPUT" --ref "$FLUTTER_REF_INPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.flutter_repo }}
          ref: ${{ steps.ref.outputs.sha }}
          path: flutter
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
      - id: plan
        run: python3 scripts/ci/golden.py --plan --flutter-root flutter >> "$GITHUB_OUTPUT"
  golden:
    needs: resolve
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      LANG: en_US.UTF-8
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free space for two Engine revisions
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc
          df -h .
      - name: Enable and verify KVM access
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: ./.github/actions/setup-flutter-tests
        with:
          flutter_repo: ${{ inputs.flutter_repo }}
          flutter_sha: ${{ needs.resolve.outputs.sha }}
          engine: 'true'
      - name: Generate baseline and compare the target revision
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          pre-emulator-launch-script: '"$ANDROID_HOME/emulator/emulator" -accel-check'
          emulator-options: -accel on -no-window -no-audio -no-snapshot -gpu swiftshader -camera-back none -camera-front none -feature Vulkan
          script: python3 scripts/ci/golden.py --suite ${{ matrix.suite }}
      - name: Capture logcat
        if: always()
        run: |
          mkdir -p test-results
          adb logcat -d > test-results/logcat.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-golden-${{ matrix.suite }}-${{ needs.resolve.outputs.sha }}
          path: test-results
          if-no-files-found: error
          retention-days: 14
